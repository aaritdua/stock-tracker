<html>
    <head>
        <!-- meta-data + links to css/js -->

        <!-- google font thing -->
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>

        <title>Stock Tracker</title>
    </head>
    <body>
        <!-- stuff visible on the page -->

        <!-- error message toast -->
        <div id="toast"></div>

        <!-- compare card toggle button -->
        <label class="toggle">
            <input type="checkbox" id="compare-toggle">
            <span class="toggle-slider"></span>
        </label>

        <!-- title -->
        <h1>Stock Predictor</h1>

        <!-- search bar for ticker -->
        <div id="search-bar">
            <input type="text" placeholder="Enter ticker" id="ticker-input"/>
            <button id="predict-btn">Predict</button>
        </div>

        <!-- spinner animation  -->
        <div id="spinner" style="display:none">
            <div class="spinner-circle"></div>
        </div>

        <!-- div for ticker info -->
        <div id="results"></div>

        <!-- div for extra info -->
        <div id="extra" style="display:none">
            <button>Train Model</button>
            <div id="past-predictions"></div>
        </div>

        <div id="compare-card" style="display:none">
            <div id="compare-card-left">
                <div id="compare-chart-wrapper">
                    <canvas id="compare-chart"></canvas>
                </div>
                <div id="compare-chart-title">90-Day Price History</div>
            </div>
            <div id="compare-card-right">
                <div id="compare-card-search-bar">
                    <input type="text" placeholder="Enter ticker" id="compare-card-ticker-input"/>
                </div>
                <div id="compare-card-scrollable-list"></div>
                <div id="compare-card-best-performer"></div>
            </div>
        </div>
    </body>
</html>
